[project]
name = "datalabs"
version = "1.1.0"
description = "Data engineering & observability lab: ANP / RFB pipelines, dbt + Elementary, RAG with pgvector"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["pipelines/dbt_projects/dbt_packages", "*.ipynb"]

[tool.ruff.lint]
# Start strict on real bugs only (syntax, undefined names); tighten as legacy code is refactored.
select = ["E9", "F63", "F7", "F82", "F401"]
per-file-ignores = { "pipelines/observability/__init__.py" = ["F401"] }
