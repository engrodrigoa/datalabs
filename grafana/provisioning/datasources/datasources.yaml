# Provisioned datasources (fixed UIDs so dashboards-as-code can reference them).
# Both Postgres datasources use the read-only role `grafana_ro` (least privilege).
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s

  - name: DW (Postgres)
    uid: dw
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: ${DB_DB}
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}

  - name: Airflow metadata (Postgres)
    uid: airflow_meta
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: airflow
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
