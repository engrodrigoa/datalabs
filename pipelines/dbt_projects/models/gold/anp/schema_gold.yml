version: 2

models:
  - name: dm_produtos
    description: "Dimensão de combustíveis monitorados."
    columns:
      - name: id_produto_sk
        data_tests:
          - unique
          - not_null

  - name: dm_postos
    description: "Dimensão de postos de revenda deduplicada."
    columns:
      - name: id_posto_sk
        data_tests:
          - unique
          - not_null
      - name: cnpj
        data_tests:
          - unique
          - not_null

  - name: ft_anp_combustiveis
    description: "Fato de coleta de preços da ANP."
    data_tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: _source_loaded_at
            time_bucket: {period: day, count: 1}
          config:
            severity: warn
            tags: ["elementary"]
    columns:
      - name: id_fato
        description: "Chave primária originada na Silver"
        data_tests:
          - unique
          - not_null
      - name: id_posto_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dm_postos')
                field: id_posto_sk
      - name: id_produto_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dm_produtos')
                field: id_produto_sk
      - name: valor_venda
        description: "Valor de venda na bomba."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0" 
  - name: ag_anp_preco_semanal
    description: "Agregado de preços por semana × UF × produto (fonte do dashboard DataLabs · ANP)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [semana, uf, produto]
    columns:
      - name: qtd_coletas
        description: "Σ qtd_coletas = linhas da fato: reconcilia com ft_anp_combustiveis."
        data_tests: [not_null]
      - name: preco_medio
        data_tests: [not_null]

  - name: ag_anp_preco_posto_atual
    description: "Último preço de cada posto × produto (serving da matriz do dashboard Streamlit)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [id_posto_sk, id_produto_sk]
    columns:
      - name: valor_venda
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
      - name: data_coleta
        data_tests: [not_null]
      - name: data_coleta_anterior
        description: "NULL quando o posto só tem uma coleta do produto."
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "< data_coleta"
              config:
                where: "data_coleta_anterior IS NOT NULL"
      - name: uf
        data_tests: [not_null]
      - name: municipio
        data_tests: [not_null]
      - name: bairro
        data_tests: [not_null]

  - name: ag_anp_preco_municipio_diario
    description: "Preço por dia de coleta × município × produto (serving da linha histórica do dashboard)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [data_coleta, uf, municipio, produto]
    columns:
      - name: qtd_postos
        description: "Σ qtd_postos = linhas da fato: reconcilia com ft_anp_combustiveis."
        data_tests: [not_null]
      - name: soma_valor_venda
        data_tests: [not_null]
      - name: preco_min
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "<= preco_max"
