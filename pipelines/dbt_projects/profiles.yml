# Committed on purpose: no secrets here, everything comes from environment variables
# (.env on the host, docker-compose `environment:` inside the containers).
datalab:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_DB') }}"
      schema: public
      threads: 4
      connect_timeout: 10

# Used by the Elementary CLI (edr report)
elementary:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_PASSWORD') }}"
      dbname: "{{ env_var('DB_DB') }}"
      schema: elementary
      threads: 4
