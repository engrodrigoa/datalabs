name: "dbt_project"
version: "1.1.0"
config-version: 2

profile: "datalab"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # required by Elementary on dbt >= 1.8 (captures test results/samples)
  require_explicit_package_overrides_for_builtin_materializations: false

# Layering: staging (views) -> silver (conformed tables) -> gold (dimensional models)
models:
  dbt_project:
    staging:
      +materialized: view
      +schema: stg
      anp:
        +tags: ["anp"]
      rfb:
        +tags: ["rfb"]
      nfe:
        +tags: ["nfe"]
    silver:
      +materialized: table
      +schema: silver
      anp:
        +tags: ["anp"]
      nfe:
        +tags: ["nfe", "silver"]
    gold:
      +materialized: table
      +schema: gold
      anp:
        +tags: ["anp"]
      rfb:
        +tags: ["rfb"]
      nfe:
        +tags: ["nfe", "gold"]

  # Elementary writes run/test history here; Grafana reads it (schema elementary)
  elementary:
    +schema: "elementary"
    +enabled: true

# NF-e: tabelas de referência (códigos com zero à esquerda -> sempre texto)
seeds:
  dbt_project:
    nfe:
      +schema: silver
      +tags: ["nfe"]

snapshots:
  dbt_project:
    nfe:
      +tags: ["nfe", "gold"]

data_tests:
  +store_failures: false
  # NF-e: falhas de qualidade viram tabelas consultáveis (quarentena) no schema dq_nfe
  dbt_project:
    silver:
      nfe: {+store_failures: true, +schema: dq_nfe}
    gold:
      nfe: {+store_failures: true, +schema: dq_nfe}
    staging:
      nfe: {+store_failures: true, +schema: dq_nfe}
    nfe: {+store_failures: true, +schema: dq_nfe}     # tests/nfe (singulares)
