name: "dbt_project"
version: "1.1.0"
config-version: 2

profile: "datalab"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # required by Elementary on dbt >= 1.8 (captures test results/samples)
  require_explicit_package_overrides_for_builtin_materializations: false

# Layering: staging (views) -> silver (conformed tables) -> gold (dimensional models)
models:
  dbt_project:
    staging:
      +materialized: view
      +schema: stg
      anp:
        +tags: ["anp"]
      rfb:
        +tags: ["rfb"]
    silver:
      +materialized: table
      +schema: silver
      anp:
        +tags: ["anp"]
    gold:
      +materialized: table
      +schema: gold
      anp:
        +tags: ["anp"]
      rfb:
        +tags: ["rfb"]

  # Elementary writes run/test history here; Grafana reads it (schema elementary)
  elementary:
    +schema: "elementary"
    +enabled: true

data_tests:
  +store_failures: false
