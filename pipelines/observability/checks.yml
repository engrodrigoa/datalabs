# Data health checks (run by dag_observability_health and at the end of each pipeline DAG).
# Types: freshness | threshold | reconciliation  -- see pipelines/observability/checks.py
# severity: error -> status "fail" (task goes red + alert) | warn -> status "warn" (alert only)
# timeout_s: per-check statement_timeout (default OBS_CHECK_TIMEOUT_S=120); a timeout ends as status "error"
# cost: heavy -> skipped by the periodic health DAG (--skip-heavy), runs only after its own pipeline
# suspended: "<motivo>" -> não executa; grava status skipped com o motivo (visível no Grafana). Temporário.
# requires: ai -> skipped (with the reason) when the image was built without INSTALL_AI=true

defaults:
  severity: error

checks:
  # ------------------------------------------------------------------ ANP (fuel prices)
  - name: anp_ingestion_freshness
    pipeline: anp
    dataset: bronze.anp_landing_semanal
    type: freshness
    query: SELECT MAX(ingestion_timestamp) FROM bronze.anp_landing_semanal
    warn_after_hours: 192     # weekly source: 8 days
    error_after_hours: 360    # 15 days without a new weekly file

  - name: anp_gold_data_freshness
    pipeline: anp
    dataset: gold.ft_anp_combustiveis
    type: freshness
    query: SELECT MAX(data_coleta) FROM gold.ft_anp_combustiveis
    warn_after_hours: 240     # survey date lags publication by a few days
    error_after_hours: 408

  - name: anp_latest_load_volume
    pipeline: anp
    dataset: bronze.anp_landing_semanal
    type: threshold
    severity: warn
    query: >
      SELECT COUNT(*) FROM bronze.anp_landing_semanal
      WHERE ingestion_timestamp = (SELECT MAX(ingestion_timestamp) FROM bronze.anp_landing_semanal)
    min: 10000

  - name: anp_uf_coverage_last_7d
    pipeline: anp
    dataset: silver.anp_combustivel
    type: threshold
    severity: warn
    query: >
      SELECT COUNT(DISTINCT estado_sigla) FROM silver.anp_combustivel
      WHERE data_coleta >= (SELECT MAX(data_coleta) - 7 FROM silver.anp_combustivel)
    min: 27                   # every UF + DF must appear in the latest week

  - name: anp_invalid_prices
    pipeline: anp
    dataset: silver.anp_combustivel
    type: threshold
    query: >
      SELECT COUNT(*) FROM silver.anp_combustivel
      WHERE valor_venda IS NULL OR valor_venda <= 0 OR valor_venda > 200
    max: 0

  - name: anp_stg_to_silver_reconciliation
    pipeline: anp
    dataset: silver.anp_combustivel
    type: reconciliation
    left_label: stg_distinct_keys
    query: >
      SELECT COUNT(*) FROM (
        SELECT chave FROM stg.stg_anp_mensal UNION SELECT chave FROM stg.stg_anp_semanal) k
    right_label: silver_rows
    compare_query: SELECT COUNT(*) FROM silver.anp_combustivel
    tolerance_pct: 0
    # recomputes the staging views over the whole bronze (~35 s): catches keys LOST between staging and
    # silver (unique/not_null on silver.chave only catch duplicates/nulls). Runs after each ANP load only.
    cost: heavy
    timeout_s: 300

  - name: anp_silver_to_gold_reconciliation
    pipeline: anp
    dataset: gold.ft_anp_combustiveis
    type: reconciliation
    left_label: silver_rows
    query: SELECT COUNT(*) FROM silver.anp_combustivel
    right_label: gold_fact_rows
    compare_query: SELECT COUNT(*) FROM gold.ft_anp_combustiveis
    tolerance_pct: 0

  - name: anp_fact_orphan_postos
    pipeline: anp
    dataset: gold.ft_anp_combustiveis
    type: threshold
    query: >
      SELECT COUNT(*) FROM gold.ft_anp_combustiveis f
      LEFT JOIN gold.dm_postos p ON p.id_posto_sk = f.id_posto_sk
      WHERE p.id_posto_sk IS NULL
    max: 0

  # ------------------------------------------------------------------ RFB (CNPJ open data)
  - name: rfb_reference_freshness
    pipeline: rfb
    dataset: landing_rfb.estabelecimentos
    type: freshness
    severity: warn            # monthly source, month chosen by hand (ref_month): warn only
    query: SELECT MAX(to_date(referencia_mes::text, 'YYYYMM')) FROM landing_rfb.estabelecimentos
    warn_after_hours: 1488    # ~62 days
    error_after_hours: 2232   # ~93 days
   

  - name: rfb_suspicious_rows_pct
    cost: heavy               # full scan of a ~60M-row table: runs after the RFB load, not every 6h
    timeout_s: 300
    pipeline: rfb
    dataset: landing_rfb.estabelecimentos
    type: threshold
    severity: warn
    query: >
      SELECT COALESCE(AVG(CASE WHEN _suspeita_deslocamento THEN 1.0 ELSE 0 END), 0) * 100
      FROM landing_rfb.estabelecimentos
      WHERE referencia_mes = (SELECT MAX(referencia_mes) FROM landing_rfb.estabelecimentos)
    max: 0.1                  # % of rows with shifted columns
    

  - name: rfb_empresas_duplicated_keys
    cost: heavy               # full scan of a ~60M-row table: runs after the RFB load, not every 6h
    timeout_s: 300
    pipeline: rfb
    dataset: landing_rfb.empresas
    type: threshold
    query: >
      SELECT COUNT(*) - COUNT(DISTINCT cnpj_basico) FROM landing_rfb.empresas
      WHERE referencia_mes = (SELECT MAX(referencia_mes) FROM landing_rfb.empresas)
    max: 0
    

  - name: rfb_landing_to_gold_reconciliation
    cost: heavy               # full scan of a ~60M-row table: runs after the RFB load, not every 6h
    timeout_s: 300
    pipeline: rfb
    dataset: gold.ft_receita_federal
    type: reconciliation
    severity: warn
    left_label: landing_distinct_cnpj
    query: >
      SELECT COUNT(DISTINCT cnpj_completo) FROM landing_rfb.estabelecimentos
      WHERE referencia_mes = (SELECT MAX(referencia_mes) FROM landing_rfb.estabelecimentos)
    right_label: gold_rows
    compare_query: SELECT COUNT(*) FROM gold.ft_receita_federal
    tolerance_pct: 1
    

  # ------------------------------------------------------------------ LC 214/2025 (legislation RAG, ADR 0010)
  # The law lives in Parquet until lc04 loads it: these checks read the step audit, which every run writes.
  - name: lc214_source_watch_freshness
    pipeline: lc214
    requires: ai
    dataset: audit.pipeline_step_runs
    type: freshness
    severity: warn
    # success = new version, skipped = checked and unchanged: both prove the source is still being watched
    query: >
      SELECT MAX(started_at) FROM audit.pipeline_step_runs
      WHERE pipeline = 'lc214' AND step = 'extract_source' AND status IN ('success', 'skipped')
    warn_after_hours: 192     # weekly DAG: 8 days
    error_after_hours: 360    # two missed weeks (severity warn caps it: alert, not red)

  - name: lc214_parse_volume
    pipeline: lc214
    requires: ai
    dataset: audit.pipeline_step_runs
    type: threshold
    severity: warn
    # 4,223 provisions today: an amendment adds or revokes a few dozen, not hundreds. A big drop means the PDF
    # layout changed and the parser lost structure in a way the invariants I1-I4 did not catch.
    query: >
      SELECT rows_out FROM audit.pipeline_step_runs
      WHERE pipeline = 'lc214' AND step = 'parse_dispositivos' AND status = 'success'
      ORDER BY started_at DESC LIMIT 1
    min: 4000

  - name: lc214_serving_parity
    pipeline: lc214
    requires: ai
    dataset: ai.lc214_dispositivo
    type: reconciliation
    # the serving table is a projection of the last parse (ADR 0011): same number of provisions, no more, no less.
    # A gap means the load failed, was blocked by the mass-delete guard, or never ran after a re-parse.
    left_label: last_parse_rows
    query: >
      SELECT rows_out FROM audit.pipeline_step_runs
      WHERE pipeline = 'lc214' AND step = 'parse_dispositivos' AND status = 'success'
      ORDER BY started_at DESC LIMIT 1
    right_label: served_provisions
    compare_query: SELECT COUNT(*) FROM ai.lc214_dispositivo
    tolerance_pct: 0

  - name: lc214_serving_single_version
    pipeline: lc214
    requires: ai
    dataset: ai.lc214_dispositivo
    type: threshold
    # one transaction restamps every row: two law versions side by side means a load that did not finish its
    # job, and the router would answer from a mix of two laws
    query: SELECT COUNT(DISTINCT (source_sha256, parser_version)) FROM ai.lc214_dispositivo
    max: 1

  - name: lc214_vector_parity
    pipeline: lc214
    requires: ai
    dataset: ai.lc214_chunk
    type: reconciliation
    # the vector store is a projection of the last chunking (ADR 0013): every chunk embedded, no orphan left.
    # A gap means embed_chunks failed, was blocked by the shrink guard, or never ran after a re-chunk.
    left_label: last_chunks_rows
    query: >
      SELECT rows_out FROM audit.pipeline_step_runs
      WHERE pipeline = 'lc214' AND step = 'build_chunks' AND status = 'success'
      ORDER BY started_at DESC LIMIT 1
    right_label: embedded_chunks
    compare_query: SELECT COUNT(*) FROM ai.lc214_chunk
    tolerance_pct: 0

  - name: lc214_vector_same_law
    pipeline: lc214
    requires: ai
    dataset: ai.lc214_chunk
    type: threshold
    # the retriever joins vectors (ai.lc214_chunk) to the provisions it shows (ai.lc214_dispositivo): both must come
    # from ONE law version and parser, and the vectors from one model and one chunker (else distances mix rulers)
    query: >
      SELECT GREATEST(
        (SELECT COUNT(*) FROM (SELECT source_sha256, parser_version FROM ai.lc214_chunk
                               UNION SELECT source_sha256, parser_version FROM ai.lc214_dispositivo) v),
        (SELECT COUNT(DISTINCT (embedding_model, chunker_version)) FROM ai.lc214_chunk))
    max: 1

  # ------------------------------------------------------------------ LLM usage per call (ai.llm_call, ADR 0018)
  - name: llm_usage_recorded
    pipeline: lc214
    requires: ai
    dataset: ai.llm_call
    type: reconciliation
    # observability of the metric itself: every call lc06 made (step metric llm_calls) has its row. The write is
    # best-effort (ADR 0001), so a lost row is not an error of the answers: it is caught here, not in the pipeline.
    # 0 = 0 before the first generation that records usage.
    left_label: calls_made
    query: >
      SELECT COALESCE((SELECT (metrics->>'llm_calls')::int FROM audit.pipeline_step_runs
                       WHERE pipeline = 'lc214' AND step = 'generate_answers' AND metrics ? 'llm_calls'
                       ORDER BY started_at DESC LIMIT 1), 0)
    right_label: calls_recorded
    compare_query: >
      SELECT COUNT(*) FROM ai.llm_call
      WHERE step_run_id = (SELECT step_run_id FROM audit.pipeline_step_runs
                           WHERE pipeline = 'lc214' AND step = 'generate_answers' AND metrics ? 'llm_calls'
                           ORDER BY started_at DESC LIMIT 1)
    tolerance_pct: 0

  - name: llm_usage_estimated_calls
    pipeline: lc214
    requires: ai
    dataset: ai.llm_call
    type: threshold
    severity: warn
    # Ollama reports prompt_eval_count on every completed call: an `estimated` row means the response came without
    # usage (server upgrade, a proxy, another provider) and the token numbers stopped being the truth
    query: >
      SELECT COUNT(*) FROM ai.llm_call
      WHERE token_method = 'estimated' AND called_at >= now() - interval '30 days'
    max: 0

  - name: llm_prompt_fills_context
    pipeline: lc214
    requires: ai
    dataset: ai.llm_call
    type: threshold
    severity: warn
    # a prompt that reaches num_ctx was truncated by the server before the model read it: the context budget
    # (retriever, words x tokens-per-word) under-estimated it
    query: >
      SELECT COUNT(*) FROM ai.llm_call
      WHERE num_ctx IS NOT NULL AND prompt_tokens_reported >= num_ctx AND called_at >= now() - interval '30 days'
    max: 0

  - name: llm_token_estimate_drift
    pipeline: lc214
    requires: ai
    dataset: ai.llm_call
    type: threshold
    severity: warn
    # median relative error of the words x tokens-per-word estimate against the reported count (30 days). The
    # retriever budgets context with that estimate: above 25% its margin (LC214_BUDGET_MARGIN 0.2) no longer
    # covers it. Ratios below 1 token/word are a cached prefix (ADR 0015), not tokenization: left out.
    # 0 when there is nothing to compare yet.
    query: >
      SELECT COALESCE(percentile_cont(0.5) WITHIN GROUP (
               ORDER BY abs(prompt_tokens_estimate::numeric / prompt_tokens_reported - 1)), 0)
      FROM ai.llm_call
      WHERE prompt_tokens_reported > 0 AND prompt_tokens_reported >= prompt_words
        AND called_at >= now() - interval '30 days'
    max: 0.25

  # ------------------------------------------------------------------ RTC reference (ADR 0019)
  # Official CST / cClassTrib / NCM tables of the Receita Federal tax calculator (GitHub mirror) and the NF-e
  # adherence built on them. Health of the LOAD (is the reference there, current, complete) is separate from the
  # QUALITY of the items (do the notes follow it): the first are errors, the second warnings for the business.
  - name: rtc_reference_loaded
    pipeline: rtc
    dataset: ctrl.rtc_carga
    type: threshold
    query: SELECT COUNT(*) FROM ctrl.rtc_carga
    min: 1                    # no version loaded: every adherence status would be "cclasstrib_inexistente"

  - name: rtc_reference_age_days
    pipeline: rtc
    dataset: ctrl.rtc_carga
    type: threshold
    severity: warn
    # days since the version in use was built. The Receita releases every 2-4 weeks (internal changelog,
    # 1.5.0 -> 1.6.0 in 35 days); 45 days without a new sha means the mirror stopped following, or our source
    # check is not seeing it. This is the measurement of the mirror's real cadence (ADR 0019, open question).
    query: SELECT COALESCE(EXTRACT(EPOCH FROM now() - MAX(built_at)) / 86400, 9999) FROM ctrl.rtc_carga
    max: 45

  - name: rtc_serving_parity
    pipeline: rtc
    dataset: ref_rtc.classificacao_tributaria
    type: reconciliation
    left_label: rows_built
    query: >
      SELECT (row_counts ->> 'CLASSIFICACAO_TRIBUTARIA')::bigint FROM ctrl.rtc_carga
      ORDER BY loaded_at DESC, carga_id DESC LIMIT 1
    right_label: rows_served
    compare_query: SELECT COUNT(*) FROM silver.rtc_cclasstrib
    tolerance_pct: 0          # the dbt model must expose every row the version brought (no join loses one)

  - name: rtc_nfe_adherence_coverage
    pipeline: rtc
    dataset: gold.ft_nfe_item_aderencia_rtc
    type: reconciliation
    left_label: nfe_items
    query: SELECT COUNT(*) FROM silver.nfe_item
    right_label: items_evaluated
    compare_query: SELECT COUNT(*) FROM gold.ft_nfe_item_aderencia_rtc
    tolerance_pct: 0          # every item gets a status (the model is rebuilt after the NF-e batches)
    severity: warn            # dag_nfe may load a batch between the dbt run and this check

  - name: rtc_nfe_ncm_ineligible_pct
    pipeline: rtc
    dataset: gold.ft_nfe_item_aderencia_rtc
    type: threshold
    severity: warn
    # % of the last 30 days' items whose cClassTrib requires an NCM list that the item's NCM is not in. A signal
    # for the business (benefit on an ineligible product), never a pipeline failure. The synthetic generator
    # injects ~0.5% (gen_nfe.py --sujo); above 1% the trend deserves a look at ag_nfe_aderencia_rtc_mensal.
    query: >
      SELECT COALESCE(100.0 * COUNT(*) FILTER (WHERE status_aderencia = 'ncm_inelegivel') / NULLIF(COUNT(*), 0), 0)
      FROM gold.ft_nfe_item_aderencia_rtc
      WHERE dt_emissao >= (SELECT MAX(dt_emissao) - 30 FROM gold.ft_nfe_item_aderencia_rtc)
    max: 1.0

  # ------------------------------------------------------------------ NF-e x LC 214 bridge (ADR 0021)
  # The legal reference of each official cClassTrib resolved into LC 214 provisions (rtc03_lc214). It needs the law
  # served in Postgres, which only the AI profile loads: on the base stack these are skipped, not warnings.
  - name: rtc_lc214_bridge_current
    pipeline: rtc
    requires: ai
    dataset: ai.rtc_lc214_fundamento
    type: threshold
    severity: warn
    # 0 = the bridge was built from the reference version in use AND the law version served. 1 = stale or missing:
    # a new version arrived and link_lc214 did not run (or failed), so items point at the provisions of an old text.
    query: >
      SELECT CASE WHEN NOT EXISTS (SELECT 1 FROM ai.rtc_lc214_fundamento) THEN 1
                  ELSE (SELECT COUNT(*) FROM (SELECT DISTINCT rtc_sha, law_sha256 FROM ai.rtc_lc214_fundamento) b
                        WHERE b.rtc_sha IS DISTINCT FROM (SELECT sha FROM ctrl.rtc_carga
                                                          ORDER BY loaded_at DESC, carga_id DESC LIMIT 1)
                           OR b.law_sha256 IS DISTINCT FROM (SELECT MIN(source_sha256) FROM ai.lc214_dispositivo))
             END
    max: 0

  - name: rtc_lc214_citations_resolved_pct
    pipeline: rtc
    requires: ai
    dataset: ai.rtc_lc214_fundamento
    type: threshold
    severity: warn
    # % of the LC 214 citations in the official references linked to ONE provision, by the reference itself or
    # by the transcription when the reference is ambiguous (ADR 0021, amendment 1; another law and
    # "Regra Geral" are not counted). A drop is a parser regression or an amendment that renumbered a cited
    # provision: the misses are named in the step's `reference_not_found` / `reference_ambiguous` events.
    query: >
      SELECT 100.0 * COUNT(*) FILTER (WHERE outcome IN ('resolved', 'resolved_by_text'))
             / NULLIF(COUNT(*) FILTER (WHERE outcome IN ('resolved', 'resolved_by_text', 'ambiguous', 'not_found')), 0)
      FROM ai.rtc_lc214_fundamento
    # measured 2026-11-22 (table 1.7.2 x law 0cf36f4433ce): 236/236 = 100% ("Art. 80 II" by the transcription);
    # floor = one miss (99.58%)
    min: 99.5

  - name: rtc_lc214_cites_inactive_provision
    pipeline: rtc
    requires: ai
    dataset: ai.rtc_lc214_fundamento
    type: threshold
    severity: warn
    # an official cClassTrib grounded in a revoked or vetoed provision: a signal for the business (the table is
    # behind the law), never a pipeline failure. Listed in gold.br_cclasstrib_lc214 (status_lei).
    query: >
      SELECT COUNT(*) FROM ai.rtc_lc214_fundamento WHERE outcome IN ('resolved', 'resolved_by_text') AND status_lei <> 'vigente'
    max: 0

  - name: rtc_lc214_transcription_diverges
    pipeline: rtc
    requires: ai
    dataset: ai.rtc_lc214_fundamento
    type: threshold
    severity: warn
    # cited provisions whose current text is NOT in the Receita's transcription (< 90% of its words): the table
    # may be behind an amendment, or carry a slip. Baseline 2026-11-22: 3 (arts. 485 I, 485 II, 487 § 2º: the
    # transcription says "ficará" for "será" and drops the rates written out); a 4th warns
    query: SELECT COUNT(*) FROM ai.rtc_lc214_fundamento WHERE texto_check = 'diverges'
    max: 3

  # A cited explanation per official cClassTrib (rtc04_explain, ADR 0022), generated by the local LLM from the
  # provisions of the bridge. AI profile only: skipped on the base stack.
  - name: rtc_explain_pending
    pipeline: rtc_explain
    requires: ai
    dataset: ai.rtc_cclasstrib_explicacao
    type: threshold
    severity: warn
    # classifications without a current explanation: planned by a run and not reached yet (a new one is a placeholder
    # row; a run spends at most RTC_EXPLAIN_MAX_MINUTES; a new model or prompt regenerates all 202 rows over a few
    # runs), or 1 when a reference is loaded and nothing was ever explained. Expected above 0 while a backlog drains;
    # persistent = Ollama down or the step failing (dag_rtc_explain). Only DDL tables: no error before dbt_rtc ran.
    query: >
      SELECT CASE WHEN EXISTS (SELECT 1 FROM ctrl.rtc_carga)
                   AND NOT EXISTS (SELECT 1 FROM ai.rtc_cclasstrib_explicacao) THEN 1
                  ELSE (SELECT COUNT(*) FROM ai.rtc_cclasstrib_explicacao WHERE pendente) END
    max: 0

  - name: rtc_explain_numbers_without_source
    pipeline: rtc_explain
    requires: ai
    dataset: ai.rtc_cclasstrib_explicacao
    type: threshold
    severity: warn
    # explanations shown that state a percentage neither the Receita's table nor the law shown carries: an invented
    # rate is the costliest error for an auditor. Each one is a row to read (numeros_sem_fonte); the gate of the step
    # fails when the count grows above explain_baseline.yml.
    query: >
      SELECT COUNT(*) FROM ai.rtc_cclasstrib_explicacao
      WHERE outcome = 'explained' AND cardinality(numeros_sem_fonte) > 0 AND NOT pendente
    max: 0

  # ------------------------------------------------------------------ the observability layer itself
  - name: obs_stale_running_steps
    pipeline: obs
    dataset: audit.pipeline_step_runs
    type: threshold
    severity: warn
    query: >
      SELECT COUNT(*) FROM audit.pipeline_step_runs
      WHERE status = 'running' AND started_at < now() - interval '6 hours'
    max: 0                    # step killed without finishing (OOM, container restart)
